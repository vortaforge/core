// =============================================================================
// macroEngine (Fabric) - build.gradle
// =============================================================================
//
// Targets Minecraft 26.3 / Fabric Loader 0.20.1 / Fabric API 0.165.2+26.3.
//
// Two things about 26.x that are easy to get wrong, and are deliberate here:
//
//   1. 26.x ships *unobfuscated*. There is no Yarn layer to remap, so the plugin
//      is `net.fabricmc.fabric-loom` (not `fabric-loom-remap`) and there is no
//      `mappings "net.fabricmc:yarn:..."` line to forget.
//   2. Java 25 is required. Not 21: Mojang's own version metadata for 26.3 names a
//      Java 25 runtime component, and the game refuses to start below it.
//
// Split client/server source sets: the warning screen is client-only while the
// scanner runs on both sides.
// =============================================================================

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "macroengine" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API is a real dependency: the world-load and client lifecycle hooks
    // the validators hang off come from it.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // The validators are plain Java with no Minecraft types in them on purpose, so
    // they can be tested without launching a game.
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_release as Integer
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Reproducible archives: identical sources must produce byte-identical jars so a
// published checksum is checkable by anyone who rebuilds from the same commit.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
