org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ is not yet fully compatible with the configuration cache (loom#1349)
org.gradle.configuration-cache=false

# Fabric Properties - verified upstream on 2026-11-06, not guessed.
#
# Loom must be a fixed release, never a -SNAPSHOT: this project is auto-discovered
# by settings.gradle like every other subproject, so a floating version means the
# same commit can build against different Loom code tomorrow.
#
# The other two mods in this repository pin Loom 1.15.5 for Minecraft 26.1.2. This
# mod targets 26.3 and needs 1.19.x: 1.15.5 predates 26.3 support.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.2+26.3

mod_version=1.0.0
maven_group=net.vortaforge
archives_base_name=macroengine

# Java 25: required by anything running on Minecraft 26.1 and newer.
java_release=25
