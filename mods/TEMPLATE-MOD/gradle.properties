# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
#
# loom_version must be a fixed release, never a -SNAPSHOT. This template is
# auto-discovered by settings.gradle like any other subproject, so a floating
# version here means an unpinned build tool in CI: the same commit can build
# against different Loom code tomorrow. 1.15.5 is what the two real mods use,
# so the template and the mods agree.
minecraft_version=26.1.2
loader_version=0.19.2
loom_version=1.15.5

# Mod Properties
mod_version=1.0.0
maven_group=net.change_me

# Dependencies
fabric_api_version=0.149.1+26.1.2