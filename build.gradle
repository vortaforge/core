// =============================================================================
// vortaforge/core - root build.gradle
//
// DATAPACKS ARE DISABLED IN THIS REPOSITORY (2026-11-05).
//
// The datapack programme was retired and hard-disarmed. Everything that used
// to live here for datapacks was extracted verbatim, as separate files, into
// archived/build/:
//
//   archived/build/origin-watermark-helpers.gradle   (was section 3)
//   archived/build/pack-packaging-helpers.gradle     (was section 3b)
//   archived/build/zip-packs.gradle                  (was section 4)
//   archived/build/pack-validation-helpers.gradle    (was section 5 helpers)
//   archived/build/check-packs.gradle                (was section 5 tasks)
//   archived/build/merge-datapacks.gradle            (was section 6)
//
// Those files are not applied and never will be unless the programme is
// re-enabled on purpose (see datapacks.disabled.json and archived/README.md).
//
// This root build now only defines what is still alive: shared repositories,
// aggregate tasks, verifyMod, the archive registry check, the datapack kill
// switch check, and the task graph wiring in build-logic/project-tasks.gradle.
//
// Sections in this file, in order:
//   1. Shared repositories (allprojects)
//   2. Aggregate tasks: lint, buildAll
//   3. verifyMod - Fabric mod sanity check
//   4. checkDatapackSwitch - fails when the datapack programme is re-armed
//   5. Archived-project registry (archived/archive.json) - checkArchive /
//      printArchiveList / printArchiveList; zipPacks and mergeDatapacks do
//      not exist any more, so the old wiring to them is gone
//   6. Root 'check' lifecycle task
//
// Logging convention: every task prefixes its own output with "[taskName]".
//
// Gradle 10 compatibility: every doFirst/doLast action avoids live Project API
// access at execution time; anything it needs is captured during
// configuration (see the comments on 'lint' and 'buildAll').
// =============================================================================

// -----------------------------------------------------------------------
// 1. Shared repositories
// -----------------------------------------------------------------------
allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

// -----------------------------------------------------------------------
// 2. Aggregate tasks
// -----------------------------------------------------------------------
tasks.register('lint') {
    group = 'verification'
    description = 'Runs checkstyle across all subprojects where configured.'
    // Real task dependency (rather than manually invoking action.execute())
    // so up-to-date checks, the task graph, and logging all work correctly.
    def checkstyleTasks = subprojects.collect { sub -> sub.tasks.matching { it.name == 'checkstyleMain' } }
    dependsOn checkstyleTasks
    // Captured at configuration time: the bare 'subprojects' getter resolves
    // through Project, and calling it (like project.hasProperty/ant.copy
    // elsewhere in this file) from inside doFirst/doLast is the deprecated,
    // Gradle-10-incompatible "Task.project at execution time" pattern.
    def totalSubprojectCount = subprojects.size()
    def withCheckstylePaths = subprojects.findAll { sub -> sub.tasks.findByName('checkstyleMain') != null }.collect { it.path }
    doFirst {
        println "[lint] running checkstyleMain on ${withCheckstylePaths.size()}/${totalSubprojectCount} subproject(s):"
        withCheckstylePaths.each { println "[lint]   - ${it}" }
    }
    doLast {
        println "[lint] completed (ran checkstyleMain where present)."
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds all subprojects.'
    // Lazy provider (not an eager .collect{} of resolved tasks at
    // configuration time) so this doesn't fail if a subproject doesn't have
    // a 'build' task yet.
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'build' } }
    // Captured at configuration time - see the 'lint' task above for why.
    def totalSubprojectCount = subprojects.size()
    def buildableCount = subprojects.count { it.tasks.findByName('build') != null }
    doFirst {
        println "[buildAll] building ${buildableCount}/${totalSubprojectCount} subproject(s) that declare a 'build' task."
    }
    doLast {
        println "[buildAll] done."
    }
}


// -----------------------------------------------------------------------
// 3. verifyMod - Fabric mod sanity check
//
// (Moved here unchanged when section 7 'clean task extension' was archived;
// this task is about mods/, not datapacks.)
// -----------------------------------------------------------------------

// verifyMod – monorepo-aware Fabric mod sanity check
task verifyMod {
    group = 'verification'
    description = 'Runs Fabric mod sanity checks across mods/ and examples/ (fabric.mod.json, mixins, duplicate ids).'

    doLast {
        List<String> errors = []
        List<String> warnings = []

        // Only look at source fabric.mod.json files, never build/ outputs
        def allModJsons = fileTree(dir: rootDir, include: [
            'mods/*/src/main/resources/fabric.mod.json',
            'examples/*/src/main/resources/fabric.mod.json'
        ]).files

        if (allModJsons.isEmpty()) {
            println '[verifyMod] no fabric.mod.json found under mods/ or examples/ – nothing to check.'
            return
        }

        println "[verifyMod] checking ${allModJsons.size()} fabric.mod.json file(s)"

        def idsSeen = [:]

        allModJsons.each { modJsonFile ->
            def rel = rootDir.toPath().relativize(modJsonFile.toPath()).toString()
            def modJson
            try {
                modJson = new groovy.json.JsonSlurper().parse(modJsonFile)
            } catch (Exception e) {
                errors << "${rel}: invalid JSON – ${e.message}"
                return
            }

            // required fields
            ['schemaVersion', 'id', 'version', 'name'].each { field ->
                if (!modJson.containsKey(field)) {
                    errors << "${rel}: missing required field '${field}'"
                }
            }

            // duplicate id detection (source files only)
            if (modJson.id) {
                if (idsSeen.containsKey(modJson.id)) {
                    warnings << "Duplicate mod id '${modJson.id}' in:\n  - ${idsSeen[modJson.id]}\n  - ${rel}"
                } else {
                    idsSeen[modJson.id] = rel
                }
            }

            def modRoot = modJsonFile.parentFile.parentFile.parentFile.parentFile // .../src/main/resources → mod root
            // Entrypoints may live in Fabric Loom's split client source set.
            def entrypoints = modJson.entrypoints
            if (entrypoints instanceof Map) {
                entrypoints.each { String key, value ->
                    (value instanceof List ? value : [value]).each { entry ->
                        String className = (entry instanceof Map) ? entry.value : entry?.toString()
                        if (className) {
                            String relPath = className.replace('.', '/') + '.java'
                            def candidates = ['src/main/java', 'src/client/java'].collect { new File(modRoot, "${it}/${relPath}") }
                            if (!candidates.any { it.isFile() }) {
                                warnings << "${rel}: entrypoint '${key}' → '${className}' has no source in main/client Java source sets"
                            }
                        }
                    }
                }
            }

            // Mixin configurations may also be in split client resources.
            def mixins = modJson.mixins
            if (mixins instanceof List) {
                mixins.each { m ->
                    String mixinPath = (m instanceof Map) ? m.config : m?.toString()
                    if (mixinPath) {
                        def candidates = ['src/main/resources', 'src/client/resources'].collect { new File(modRoot, "${it}/${mixinPath}") }
                        if (!candidates.any { it.isFile() }) {
                            warnings << "${rel}: mixin config '${mixinPath}' not found in main/client resources"
                        }
                    }
                }
            }
        }

        // root build.gradle smells
        def rootBuild = file('build.gradle')
        if (rootBuild.exists()) {
            // Match a call at the start of a statement, not this check's own
            // string literals/comments. This is a heuristic, not a Groovy parser.
            if (rootBuild.readLines('UTF-8').any { it ==~ /\s*(?:repositories\s*\{\s*)?mavenLocal\s*\(\s*\).*/ }) {
                warnings << "root build.gradle uses mavenLocal() – remove for reproducible CI builds"
            }
        }

        // Report
        println ''
        println '================ verifyMod report ================'
        if (warnings.isEmpty() && errors.isEmpty()) {
            println 'No issues found.'
        }
        warnings.each { println "WARN  ${it}\n" }
        errors.each { println "ERROR ${it}\n" }
        println "Summary: ${errors.size()} error(s), ${warnings.size()} warning(s)."
        println '====================================================='
        println ''

        // Only hard-fail on real errors (invalid JSON / missing required fields)
        if (!errors.isEmpty()) {
            throw new GradleException("verifyMod found ${errors.size()} error(s). See report above.")
        }
    }
}

// -----------------------------------------------------------------------
// 4. Datapack kill switch
//
// datapacks.disabled.json is the switch ("enabled": false). A missing or
// unreadable switch counts as DISABLED (fail-closed), so this task fails only
// when the programme has been deliberately re-armed. The marker file and the
// registry are cross-checked too: the three must never disagree.
//
// python3 scripts/datapacks_disable.py verify    is the same check outside
// Gradle, and CI runs both.
// -----------------------------------------------------------------------
tasks.register('checkDatapackSwitch') {
    group = 'verification'
    description = 'Fails when the datapack kill switch is not engaged (datapacks.disabled.json enabled=false) or its marker/registry disagree.'
    def switchFile = rootProject.file('datapacks.disabled.json')
    def markerFile = rootProject.file('archived/datapacks.disabled')
    def registryFile = rootProject.file('archived/archive.json')
    def pythonExec = providers.gradleProperty('pythonExecutable').getOrElse('python3')
    def repoDir = rootProject.projectDir
    def projectDirCap = rootProject.projectDir
    doLast {
        def errors = []
        if (!switchFile.exists()) {
            errors << "datapacks.disabled.json is missing (fail-closed: missing means disabled, but it must exist)"
        } else {
            try {
                def data = new groovy.json.JsonSlurper().parse(switchFile)
                if (data.enabled != false) {
                    errors << "datapacks.disabled.json says enabled=${data.enabled}; the kill switch is not engaged"
                }
            } catch (Exception e) {
                errors << "datapacks.disabled.json is unreadable: ${e.message}"
            }
        }
        if (!markerFile.exists()) {
            errors << "archived/datapacks.disabled marker is missing"
        }
        try {
            def registry = new groovy.json.JsonSlurper().parse(registryFile)
            def projects = (registry instanceof Map && registry.projects instanceof List) ? registry.projects : []
            if (projects.isEmpty()) {
                errors << "archived/archive.json has no projects"
            }
            def armed = projects.findAll { p -> p instanceof Map && p.disarmed != true }
            if (armed) {
                errors << "registry entries are not disarmed: " + armed.collect { it.id }.join(', ')
            }
        } catch (Exception e) {
            errors << "archived/archive.json is unreadable: ${e.message}"
        }
        errors.each { println "[checkDatapackSwitch] ERROR: ${it}" }
        if (errors) {
            throw new GradleException("[checkDatapackSwitch] failed: ${errors.size()} problem(s). " +
                    "See datapacks.disabled.json and archived/README.md.")
        }
        println '[checkDatapackSwitch] OK: datapacks are disabled, the marker is present and every registry entry is disarmed.'
    }
}

// -----------------------------------------------------------------------
// 5. Archived-project registry (archived/archive.json)
//
// archived/ is deliberately OUTSIDE packs/, so nothing there can be packaged
// or merged. This section keeps the registry honest:
//   - checkArchive: validates archived/archive.json against schema_version 2
//     (shape, enums, unique ids, dates, path existence, hard-disable flags,
//     bijection between archived/packs|tools and registry entries, no live
//     datapack tooling, no workflow file under archived/) through
//     scripts/check_archive.py. Read-only: never writes, never runs anything.
//     -PcheckArchiveStrict=true also fails on warnings.
//   - printArchiveList: prints the registry (read-only, lenient).
// Wiring: 'check' depends on checkArchive and checkDatapackSwitch.
// Same rules as above: everything doLast needs is captured at configuration
// time (no Project access during execution).
// -----------------------------------------------------------------------
tasks.register('checkArchive') {
    group = 'verification'
    description = 'Validates archived/archive.json (schema v2, disarmed entries) via scripts/check_archive.py. Read-only. -PcheckArchiveStrict=true also fails on warnings.'
    def registryFile = rootProject.file('archived/archive.json')
    def pythonExec = providers.gradleProperty('pythonExecutable').getOrElse('python3')
    def repoDir = rootProject.projectDir
    def strictProp = providers.gradleProperty('checkArchiveStrict').getOrElse('false')
    doLast {
        if (!registryFile.exists()) {
            throw new GradleException("[checkArchive] failed: archived/archive.json is missing.")
        }
        def command = [pythonExec, 'scripts/check_archive.py']
        if (strictProp.toString().equalsIgnoreCase('true')) {
            command << '--strict'
        }
        def process = new ProcessBuilder(command)
                .directory(repoDir)
                .redirectErrorStream(true)
                .start()
        process.inputStream.eachLine { line -> println line }
        def exit = process.waitFor()
        if (exit != 0) {
            throw new GradleException("[checkArchive] failed: scripts/check_archive.py exited ${exit}.")
        }
    }
}

tasks.register('printArchiveList') {
    group = 'help'
    description = 'Lists every project in archived/archive.json (read-only, no validation).'
    def registryFile = rootProject.file('archived/archive.json')
    doLast {
        if (!registryFile.exists()) {
            println '[printArchiveList] no archived/archive.json found.'
            return
        }
        def data = new groovy.json.JsonSlurper().parse(registryFile)
        def projects = (data instanceof Map && data.projects instanceof List) ? data.projects : []
        if (projects.isEmpty()) {
            println '[printArchiveList] no archived projects.'
            return
        }
        println "[printArchiveList] ${projects.size()} archived project(s):"
        projects.each { p ->
            println "[printArchiveList]   - ${p.id} [${p.status}, deploy=${p.deploy}${p.disarmed == true ? ', disarmed' : ''}] " +
                    "${p.name} ${p.last_version} (archived ${p.archived_on})" + (p.successor ? " -> ${p.successor}" : '')
        }
    }
}

// -----------------------------------------------------------------------
// 6. Root 'check' lifecycle task
//
// Root project has no Java plugin, so 'check' is created explicitly:
// verification = verifyMod + the archive registry + the datapack kill switch.
// zipPacks / mergeDatapacks are gone, so no packaging wiring remains here -
// see build-logic/project-tasks.gradle for the repository-level tasks.
// -----------------------------------------------------------------------
tasks.maybeCreate('check').configure {
    group = 'verification'
    description = 'Runs suite-level verification (verifyMod, checkArchive, checkDatapackSwitch).'
    dependsOn 'verifyMod', 'checkArchive', 'checkDatapackSwitch'
}

// Repository-level verification, packaging and CI entry points live in a
// dedicated script so this root build stays focused on its module tasks.
// See `gradlew tasks --group verification`.
apply from: "$rootDir/build-logic/project-tasks.gradle"

