// =============================================================================
// vortaforge/core - root build.gradle
//
// This file only defines cross-cutting tasks that operate across the whole
// monorepo (mods/, examples/). Per-subproject build logic lives in each
// subproject's own build.gradle - this file never configures a subproject's
// Java/Fabric toolchain directly.
//
// All datapack and resource-pack tasks (zipPacks, checkPacks, mergeDatapacks,
// origin watermarks, ...) were archived; their code is in
// archived/tasks/datapack-tasks.gradle and is not loaded.
//
// Sections in this file, in order:
//   1. Shared repositories (allprojects)
//   2. Aggregate tasks: lint, buildAll
//   3. printModList / printModVersions - Fabric mod listing helpers
//   4. clean task extension - also wipes build/dist
//   5. verifyMod / check - Fabric mod sanity checks
//   6. Root 'build' lifecycle task (alias for buildAll)
//   7. checkArchive / printArchiveList - archived/archive.json registry validation
//

// Logging convention: every task prefixes its own output with "[taskName]"
// so `gradle buildAll` (which runs several of these back to back) never
// produces an ambiguous line - you can always tell which task printed what.
//
// Gradle 10 compatibility note: every doFirst/doLast/configureEach action in
// this file avoids live Project API access at execution time (the bare
// 'subprojects' getter, 'project.hasProperty'/'project.property', 'file(...)',
// and AntBuilder via 'ant.copy'/'ant.zip' all resolve through Project, and
// Gradle deprecated - and will remove in Gradle 10 - calling any of them once
// a task is executing). Anything a doFirst/doLast needs from the Project is
// captured into a plain local variable during configuration instead; see the
// comments on 'lint', 'buildAll', and the 'clean' extension.
// =============================================================================

// -----------------------------------------------------------------------
// 1. Shared repositories
// -----------------------------------------------------------------------
allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
    }
}

// -----------------------------------------------------------------------
// 2. Aggregate tasks
// -----------------------------------------------------------------------
tasks.register('lint') {
    group = 'verification'
    description = 'Runs checkstyle across all subprojects where configured.'
    // Real task dependency (rather than manually invoking action.execute())
    // so up-to-date checks, the task graph, and logging all work correctly.
    def checkstyleTasks = subprojects.collect { sub -> sub.tasks.matching { it.name == 'checkstyleMain' } }
    dependsOn checkstyleTasks
    // Captured at configuration time: the bare 'subprojects' getter resolves
    // through Project, and calling it (like project.hasProperty/ant.copy
    // elsewhere in this file) from inside doFirst/doLast is the deprecated,
    // Gradle-10-incompatible "Task.project at execution time" pattern.
    def totalSubprojectCount = subprojects.size()
    def withCheckstylePaths = subprojects.findAll { sub -> sub.tasks.findByName('checkstyleMain') != null }.collect { it.path }
    doFirst {
        println "[lint] running checkstyleMain on ${withCheckstylePaths.size()}/${totalSubprojectCount} subproject(s):"
        withCheckstylePaths.each { println "[lint]   - ${it}" }
    }
    doLast {
        println "[lint] completed (ran checkstyleMain where present)."
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds all subprojects.'
    // Lazy provider (not an eager .collect{} of resolved tasks at
    // configuration time) so this doesn't fail if a subproject doesn't have
    // a 'build' task yet.
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'build' } }
    // Captured at configuration time - see the 'lint' task above for why.
    def totalSubprojectCount = subprojects.size()
    def buildableCount = subprojects.count { it.tasks.findByName('build') != null }
    doFirst {
        println "[buildAll] building ${buildableCount}/${totalSubprojectCount} subproject(s) that declare a 'build' task."
    }
    doLast {
        println "[buildAll] done."
    }
}

// printModList: the mods/ counterpart to printPackList above. There was
// previously no way to list mod subprojects without either reading
// settings.gradle by hand or running a real build ('buildAll'/':mods:x:build').
// A mod folder is detected the same way Gradle itself would include it as a
// subproject: it's an immediate child of mods/ with its own build.gradle.
tasks.register('printModList') {
    group = 'help'
    description = 'Lists every detected Fabric mod folder under mods/ (immediate subfolders with their own build.gradle) without building anything.'
    def modsRoot = rootProject.file('mods')
    doLast {
        if (!modsRoot.exists()) {
            println "[printModList] no mods/ directory found."
            return
        }
        def found = []
        modsRoot.eachFile { d ->
            if (d.isDirectory() && new File(d, 'build.gradle').exists()) {
                found << d.name
            }
        }
        if (found.isEmpty()) {
            println "[printModList] no mods found."
        } else {
            println "[printModList] detected ${found.size()} mod(s):"
            found.sort().each { println "[printModList]   - ${it}" }
        }
    }
}

// printModVersions: the id/version counterpart to printModList above -
// read-only, does not build anything, and tolerates a missing or invalid
// fabric.mod.json (reported inline rather than failing the task) since
// unlike verifyMod this task is meant for a quick listing, not validation.
tasks.register('printModVersions') {
    group = 'help'
    description = 'Lists every detected Fabric mod under mods/ with its id and version from fabric.mod.json, without building anything.'
    def modsRoot = rootProject.file('mods')
    doLast {
        if (!modsRoot.exists()) {
            println "[printModVersions] no mods/ directory found."
            return
        }
        def slurper = new groovy.json.JsonSlurper()
        def found = []
        modsRoot.eachFile { d ->
            if (d.isDirectory() && new File(d, 'build.gradle').exists()) {
                def modJsonFile = new File(d, 'src/main/resources/fabric.mod.json')
                def label
                if (modJsonFile.exists()) {
                    try {
                        def modJson = slurper.parse(modJsonFile)
                        label = "${modJson.id ?: '?'} (v${modJson.version ?: '?'})"
                    } catch (Exception e) {
                        label = "(invalid fabric.mod.json: ${e.message})"
                    }
                } else {
                    label = '(no fabric.mod.json found)'
                }
                found << "${d.name}: ${label}"
            }
        }
        if (found.isEmpty()) {
            println "[printModVersions] no mods found."
        } else {
            println "[printModVersions] detected ${found.size()} mod(s):"
            found.sort().each { println "[printModVersions]   - ${it}" }
        }
    }
}

// -----------------------------------------------------------------------
// 4. clean task extension
//
// The default 'clean' already deletes build/; this also removes build/dist
// explicitly and logs it, regardless of how a subproject overrides 'clean'.
// -----------------------------------------------------------------------
tasks.matching { it.name == 'clean' }.configureEach {
    // Captured at configuration time - see the 'lint' task above for why
    // 'file(...)' can't be called from inside doLast itself.
    def distDir = file('build/dist')
    doLast {
        if (distDir.exists()) {
            distDir.deleteDir()
            println "[clean] removed build/dist/"
        }
    }
}

// verifyMod – monorepo-aware Fabric mod sanity check
task verifyMod {
    group = 'verification'
    description = 'Runs Fabric mod sanity checks across mods/ and examples/ (fabric.mod.json, mixins, duplicate ids).'

    doLast {
        List<String> errors = []
        List<String> warnings = []

        // Only look at source fabric.mod.json files, never build/ outputs
        def allModJsons = fileTree(dir: rootDir, include: [
            'mods/*/src/main/resources/fabric.mod.json',
            'examples/*/src/main/resources/fabric.mod.json'
        ]).files.findAll { f ->
            // Skip the two folders that settings.gradle already excludes
            !f.path.contains("${File.separator}datapack-fixer${File.separator}") &&
            !f.path.contains("${File.separator}RTWrapper${File.separator}rtwrapper-fabric${File.separator}")
        }

        if (allModJsons.isEmpty()) {
            println '[verifyMod] no fabric.mod.json found under mods/ or examples/ – nothing to check.'
            return
        }

        println "[verifyMod] checking ${allModJsons.size()} fabric.mod.json file(s)"

        def idsSeen = [:]

        allModJsons.each { modJsonFile ->
            def rel = rootDir.toPath().relativize(modJsonFile.toPath()).toString()
            def modJson
            try {
                modJson = new groovy.json.JsonSlurper().parse(modJsonFile)
            } catch (Exception e) {
                errors << "${rel}: invalid JSON – ${e.message}"
                return
            }

            // required fields
            ['schemaVersion', 'id', 'version', 'name'].each { field ->
                if (!modJson.containsKey(field)) {
                    errors << "${rel}: missing required field '${field}'"
                }
            }

            // duplicate id detection (source files only)
            if (modJson.id) {
                if (idsSeen.containsKey(modJson.id)) {
                    warnings << "Duplicate mod id '${modJson.id}' in:\n  - ${idsSeen[modJson.id]}\n  - ${rel}"
                } else {
                    idsSeen[modJson.id] = rel
                }
            }

            // entrypoints → source classes (warning only – templates often lack client classes)
            def entrypoints = modJson.entrypoints
            if (entrypoints instanceof Map) {
                def modRoot = modJsonFile.parentFile.parentFile.parentFile.parentFile // .../src/main/resources → mod root
                entrypoints.each { String key, value ->
                    (value instanceof List ? value : [value]).each { entry ->
                        String className = (entry instanceof Map) ? entry.value : entry?.toString()
                        if (className) {
                            String relPath = className.replace('.', '/') + '.java'
                            def javaFile = new File(modRoot, "src/main/java/${relPath}")
                            if (!javaFile.exists()) {
                                warnings << "${rel}: entrypoint '${key}' → '${className}' has no source at ${javaFile}"
                            }
                        }
                    }
                }
            }

            // mixin configs – warning only (TEMPLATE-MOD and similar stubs often omit them)
            def mixins = modJson.mixins
            if (mixins instanceof List) {
                mixins.each { m ->
                    String mixinPath = (m instanceof Map) ? m.config : m?.toString()
                    if (mixinPath) {
                        def mixinFile = new File(modJsonFile.parentFile, mixinPath)
                        if (!mixinFile.exists()) {
                            warnings << "${rel}: mixin config '${mixinPath}' not found"
                        }
                    }
                }
            }
        }

        // root build.gradle smells
        def rootBuild = file('build.gradle')
        if (rootBuild.exists()) {
            String text = rootBuild.text
            if (text.contains('mavenLocal()')) {
                warnings << "root build.gradle uses mavenLocal() – remove for reproducible CI builds"
            }
        }

        // Report
        println ''
        println '================ verifyMod report ================'
        if (warnings.isEmpty() && errors.isEmpty()) {
            println 'No issues found.'
        }
        warnings.each { println "WARN  ${it}\n" }
        errors.each { println "ERROR ${it}\n" }
        println "Summary: ${errors.size()} error(s), ${warnings.size()} warning(s)."
        println '====================================================='
        println ''

        // Only hard-fail on real errors (invalid JSON / missing required fields)
        if (!errors.isEmpty()) {
            throw new GradleException("verifyMod found ${errors.size()} error(s). See report above.")
        }
    }
}

// Root project has no Java plugin → no default 'check' task.
// maybeCreate makes ./gradlew check and the build lifecycle work.
tasks.maybeCreate('check').configure {
    group = 'verification'
    description = 'Runs suite-level verification tasks (including verifyMod).'
    dependsOn 'verifyMod'
}

// -----------------------------------------------------------------------
// 6. Root 'build' lifecycle task
//
// The root project has no Java/base plugin, so './gradlew build' from the repo
// root needs a task named 'build'. It is an alias for buildAll, which builds
// every Fabric subproject that declares a 'build' task.
// -----------------------------------------------------------------------
tasks.maybeCreate('build').configure {
    group = 'build'
    description = 'Builds every Fabric subproject (alias for buildAll).'
    dependsOn 'buildAll'
}


// -----------------------------------------------------------------------
// 7. Archived-project registry (archived/archive.json)
//
// archived/ is outside every Gradle scan root (settings.gradle scans mods/ and
// examples/ only), so archived projects are never built. This section keeps the
// registry honest:
//   - checkArchive: validates archived/archive.json (shape, enums, unique
//     ids, date format, path existence) and fails if an archived path is
//     missing or sits outside archived/. Read-only: never writes, never runs
//     anything. -PcheckArchiveStrict=true also fails on warnings.
//   - printArchiveList: prints the registry (read-only, lenient).
// Wiring: 'check' depends on checkArchive. If neither archived/ nor
// archive.json exists the check is skipped (not an error).
// Everything doLast needs is captured at configuration time (no Project
// access during execution).
// -----------------------------------------------------------------------
def vcArchiveKinds = ['datapack', 'mod', 'resourcepack', 'script', 'other'] as Set
def vcArchiveStatuses = ['archived', 'frozen', 'superseded'] as Set
def vcArchiveDeploy = ['not_recommended', 'review_required', 'ok'] as Set
def vcArchiveRequired = ['id', 'name', 'kind', 'status', 'archived_on', 'reason', 'last_version', 'license', 'deploy', 'successor']
def vcArchiveAllowed = (vcArchiveRequired + ['minecraft', 'path', 'source_url', 'known_issues']) as Set

def vcValidateArchive = { File rootDir, File registryFile ->
    def errors = []
    def warnings = []
    def count = 0
    def fail = { String msg -> errors << msg; return [errors: errors, warnings: warnings, count: count] }

    def data
    try {
        data = new groovy.json.JsonSlurper().parse(registryFile)
    } catch (Exception e) {
        return fail("cannot parse ${registryFile.name}: ${e.message}")
    }
    if (!(data instanceof Map)) return fail("${registryFile.name}: top level must be an object")
    if (data.schema_version != 1) errors << "schema_version must be 1"
    if (!(data.projects instanceof List)) return fail("'projects' must be an array")

    def rootPath = rootDir.canonicalFile.toPath()
    def archivedPath = new File(rootDir, 'archived').canonicalFile.toPath()
    def seen = [] as Set

    data.projects.eachWithIndex { p, i ->
        if (!(p instanceof Map)) { errors << "projects[${i}]: must be an object"; return }
        count++
        def tag = "projects[${i}] (${p.id ?: '?'})"
        vcArchiveRequired.each { k -> if (!p.containsKey(k)) errors << "${tag}: missing '${k}'" }
        p.keySet().each { k -> if (!vcArchiveAllowed.contains(k)) errors << "${tag}: unknown field '${k}'" }

        def id = p.id?.toString()
        if (id == null || !(id ==~ /[a-z0-9][a-z0-9._-]*/)) errors << "${tag}: bad id"
        else if (!seen.add(id)) errors << "${tag}: duplicate id"
        if (!vcArchiveKinds.contains(p.kind)) errors << "${tag}: bad kind '${p.kind}'"
        if (!vcArchiveStatuses.contains(p.status)) errors << "${tag}: bad status '${p.status}'"
        if (!vcArchiveDeploy.contains(p.deploy)) errors << "${tag}: bad deploy '${p.deploy}'"
        if (!(p.archived_on?.toString() ==~ /\d{4}-\d{2}-\d{2}/)) errors << "${tag}: archived_on must be YYYY-MM-DD"
        if (p.known_issues != null && !(p.known_issues instanceof List)) errors << "${tag}: known_issues must be an array"

        def pathVal = p.path
        if (pathVal != null && !(pathVal instanceof String)) {
            errors << "${tag}: path must be a string or null"
        } else if (pathVal) {
            def rp = new File(rootDir, pathVal).canonicalFile
            if (!rp.toPath().startsWith(rootPath)) errors << "${tag}: path escapes the repo"
            else if (!rp.exists()) errors << "${tag}: path '${pathVal}' does not exist"
            else if (!rp.toPath().startsWith(archivedPath)) errors << "${tag}: archived project path must be inside archived/"
        }
        def succ = p.successor
        if (succ != null && !(succ instanceof String)) {
            errors << "${tag}: successor must be a string or null"
        } else if (succ) {
            if (succ == id) errors << "${tag}: successor cannot be itself"
            else if (!new File(rootDir, succ).exists() && !data.projects.any { it instanceof Map && it.id == succ }) warnings << "${tag}: successor '${succ}' is neither a repo path nor a registry id"
        }
    }
    [errors: errors, warnings: warnings, count: count]
}

tasks.register('checkArchive') {
    group = 'verification'
    description = 'Validates archived/archive.json (shape, enums, unique ids, path inside archived/). Read-only. -PcheckArchiveStrict=true also fails on warnings. Skipped if neither archived/ nor archive.json exists.'
    def rootDirCap = rootProject.projectDir
    def archivedDir = rootProject.file('archived')
    def registryFile = rootProject.file('archived/archive.json')
    def strictProp = project.findProperty('checkArchiveStrict')
    doLast {
        if (!registryFile.exists()) {
            if (archivedDir.exists()) {
                throw new GradleException("[checkArchive] failed: archived/ exists but archived/archive.json is missing.")
            }
            println "[checkArchive] no archived/ directory - skipped."
            return
        }
        def strict = (strictProp?.toString()?.toLowerCase() == 'true')
        def result = vcValidateArchive(rootDirCap, registryFile)
        result.warnings.each { println "[checkArchive] WARN: ${it}" }
        result.errors.each { println "[checkArchive] ERROR: ${it}" }
        if (result.errors) {
            throw new GradleException("[checkArchive] failed: ${result.errors.size()} error(s) in ${result.count} project(s).")
        }
        if (strict && result.warnings) {
            throw new GradleException("[checkArchive] failed strict mode: ${result.warnings.size()} warning(s) (-PcheckArchiveStrict=true).")
        }
        println "[checkArchive] OK: ${result.count} archived project(s) valid."
    }
}

tasks.register('printArchiveList') {
    group = 'help'
    description = 'Lists every project in archived/archive.json (read-only, no validation).'
    def registryFile = rootProject.file('archived/archive.json')
    doLast {
        if (!registryFile.exists()) {
            println "[printArchiveList] no archived/archive.json found."
            return
        }
        def data = new groovy.json.JsonSlurper().parse(registryFile)
        def projects = (data instanceof Map && data.projects instanceof List) ? data.projects : []
        if (projects.isEmpty()) {
            println "[printArchiveList] no archived projects."
            return
        }
        println "[printArchiveList] ${projects.size()} archived project(s):"
        projects.each { p ->
            println "[printArchiveList]   - ${p.id} [${p.status}, deploy=${p.deploy}] ${p.name} ${p.last_version} (archived ${p.archived_on})" +
                    (p.successor ? " -> ${p.successor}" : "")
        }
    }
}

// Wiring: 'check' validates the registry.
tasks.named('check') { dependsOn 'checkArchive' }
