# Keeps GitHub Actions, Gradle, Python (pip) and npm dependencies up to date via PRs.
# Packs under packs/ contain no ecosystem manifests Dependabot would touch.
#
# Dependabot *version* updates are enabled weekly below, capped at 9 open PRs
# per ecosystem. (A previous revision of this comment described a maintenance
# pause with `open-pull-requests-limit: 0`, while the configured limits were 9
# and update PRs were being merged; the configuration, not that comment, was
# the behaviour GitHub ran.) Dependabot alerts and security updates are
# controlled separately in the repository settings and are not affected by
# these limits. To pause version updates, set every limit below to 0.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 9

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 9

  # Pip (Python) dependency updates. The only requirements.txt /
  # pyproject.toml in the tree live in scripts/gui_generator, so "/" never
  # matched anything.
  - package-ecosystem: "pip"
    directory: "/scripts/gui_generator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 9

  # Each npm tool has its own lockfile. Updates still need human review,
  # including the datapack linter's security override and runtime pins.
  - package-ecosystem: "npm"
    directory: "/scripts/dpgen"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 9

  - package-ecosystem: "npm"
    directory: "/scripts/datapack_lint"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 9
