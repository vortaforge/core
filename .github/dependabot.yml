# Keeps GitHub Actions, Gradle and Python (pip) dependencies up to date via PRs.
# 2026-11-05: the npm entries for scripts/dpgen and scripts/datapack_lint were
# removed because both tools moved to archived/tools/ - Dependabot must not open
# PRs against archived code (the datapack guard would refuse them anyway).
#
# Dependabot *version* updates are enabled weekly below, capped at 9 open PRs
# per ecosystem. (A previous revision of this comment described a maintenance
# pause with `open-pull-requests-limit: 0`, while the configured limits were 9
# and update PRs were being merged; the configuration, not that comment, was
# the behaviour GitHub ran.) Dependabot alerts and security updates are
# controlled separately in the repository settings and are not affected by
# these limits. To pause version updates, set every limit below to 0.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 9

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 9

  # Pip (Python) dependency updates. The only requirements.txt /
  # pyproject.toml in the tree live in archived/tools/gui-generator, so "/" never
  # matched anything.
  - package-ecosystem: "pip"
    directory: "/archived/tools/gui-generator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 9

  # The npm tools (dpgen, datapack lint and their lockfiles) are archived under
  # archived/tools/. No npm ecosystem entry here on purpose: archived
  # dependencies are frozen, not updated.
