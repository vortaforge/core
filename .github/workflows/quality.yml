name: Reusable Quality

# The caller owns trigger, concurrency and publication. This workflow only
# checks out and executes repository code with a read-only token, then uploads
# bounded artifacts. Keeping this as a reusable workflow makes the trust
# boundary visible and lets other trusted workflows reuse the exact same gate.

on:
  workflow_call:
    outputs:
      verified:
        description: "true only after every quality job and the canonical Gradle ci graph pass"
        value: ${{ jobs.gate.outputs.verified }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 50

    permissions:
      contents: read

    env:
      FORCE_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/gui_generator/pyproject.toml
            scripts/gui_generator/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/dpgen/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install offline quality tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "mecha==0.101.0" \
            "pytest" \
            "build" \
            "twine" \
            -e ./scripts/gui_generator

      - name: Run canonical project CI task graph
        shell: bash
        # Loom remapping is memory-intensive. Cap worker concurrency so this
        # one daemon stays within the standard hosted runner budget.
        run: ./gradlew ci -PconfirmZip=yes --console=plain --max-workers=2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          files=(build/packs-dist/*.zip build/dist/*.zip)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=No release assets::packageProject produced no pack ZIPs."
            exit 1
          fi

          duplicate_names="$(printf '%s\n' "${files[@]}" | xargs -n1 basename | sort | uniq -d)"
          if [ -n "$duplicate_names" ]; then
            echo "::error title=Duplicate release asset names::${duplicate_names}"
            exit 1
          fi

          cp -v "${files[@]}" release-assets/
          ( cd release-assets && sha256sum -- *.zip > SHA256SUMS )

      - name: Write job summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Quality summary"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Gradle entry point | \`./gradlew ci -PconfirmZip=yes\` |"
            echo "| Java | \`25\` |"
            echo "| Python | \`3.12\` |"
            echo "| Node | \`20\` |"
            echo "| Release assets | \`$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-outputs
          path: |
            mods/**/build/libs/*.jar
            examples/**/build/libs/*.jar
            build/packs-dist/*.zip
            build/dist/**
            build/reports/repository/project-inventory.json
            build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-packs
          path: |
            release-assets/*.zip
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  guigenmc-package:
    name: guigenmc source and wheel package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/gui_generator/pyproject.toml

      - name: Build and inspect package
        shell: bash
        working-directory: scripts/gui_generator
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"Expected one wheel, found {wheels!r}")
          if not any(name.endswith("static/index.html") for name in zipfile.ZipFile(wheels[0]).namelist()):
              sys.exit("Wheel is missing static/index.html")
          PY

      - name: Upload guigenmc distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guigenmc-distributions
          path: scripts/gui_generator/dist/*
          if-no-files-found: error
          retention-days: 7

  gate:
    name: Quality gate
    needs: [verify, guigenmc-package]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.gate.outputs.verified }}

    permissions:
      contents: read

    steps:
      - name: Evaluate required jobs
        id: gate
        shell: bash
        env:
          VERIFY: ${{ needs.verify.result }}
          PACKAGE: ${{ needs.guigenmc-package.result }}
        run: |
          set -euo pipefail
          {
            echo "# Quality gate"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Verify, test and package | \`$VERIFY\` |"
            echo "| guigenmc package | \`$PACKAGE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$VERIFY" = success ] && [ "$PACKAGE" = success ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "verified=false" >> "$GITHUB_OUTPUT"
          echo "::error title=Quality gate failed::One or more required jobs did not succeed."
          exit 1
