name: Reusable Quality

# The caller owns trigger, concurrency and publication. This workflow only
# checks out and executes repository code with a read-only token, then uploads
# bounded artifacts. Keeping this as a reusable workflow makes the trust
# boundary visible and lets other trusted workflows reuse the exact same gate.
#
# 2026-11-05 - datapack programme retired. Two changes here:
#   * a new, separate "Datapack guard" job runs BEFORE verification and is
#     fail-closed: scripts/datapack_guard.py blocks new datapack content,
#     revived archived tooling, blocklisted accounts and a disengaged kill
#     switch. It also runs on `pull_request_target`-free pull_request events
#     from forks, where the token is read-only; its report is uploaded and,
#     for PRs, annotated on the diff.
#   * the "Collect release assets" step no longer expects pack ZIPs: the
#     datapacks that produced them are archived, so only mod jars are shipped.

on:
  workflow_call:
    outputs:
      verified:
        description: "true only after every quality job and the canonical Gradle ci graph pass"
        value: ${{ jobs.gate.outputs.verified }}

permissions:
  contents: read

jobs:
  datapack-guard:
    name: Datapack guard (new datapacks, blocklist, kill switch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read-only by design: the guard never writes to the repository, it only
    # reads the diff, the registry and the blocklist through `git` and the
    # event payload.
    #
    # Do NOT add `pull-requests:` here. A called (reusable) workflow may only
    # narrow the permissions granted by its caller, never widen them: build.yml
    # grants `contents: read` and requesting more made the whole CI run fail
    # with an unexplained `startup_failure`. PR metadata arrives through the
    # event payload (github.event.pull_request.*), which needs no token scope.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Guard the archive (diff, blocklist, registry, kill switch)
        shell: bash
        env:
          # Both are metadata only, never credentials.
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Fail-closed: an unknown base or label state must not silently pass.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="$(git merge-base "origin/${GITHUB_BASE_REF}" "$PR_SHA" 2>/dev/null || true)"
            if [ -z "$base" ]; then
              echo "::error title=Guard base ref::Could not compute a merge base for ${GITHUB_BASE_REF}."
              exit 1
            fi
            args=(--base "$base")
          else
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            args=(--base "$base")
          fi

          # A present `datapack-approved` label is the only documented override.
          case ",${PR_LABELS:-}," in
            *",datapack-approved,"*) export DATAPACK_GUARD_LABEL_PRESENT=1 ;;
          esac

          python3 scripts/datapack_guard.py "${args[@]}" \
            --protect --blocklist --pr --check-archive \
            --login "$PR_AUTHOR" --json --report datapack-guard-report.json | tee guard.json || status=$?

          # Human-readable summary in the job log and on the PR summary.
          python3 - <<'SUMMARY_EOF'
          import json, sys
          try:
              report = json.load(open("datapack-guard-report.json"))
          except Exception:
              report = {"errors": [], "warnings": [], "checked": 0}
          lines = ["## Datapack guard", "", f"Checked: {report.get('checked', 0)}", ""]
          if report.get("errors"):
              lines += ["### Blocked", ""]
              lines += [f"- **{e['rule']}** `{e['path']}` — {e['message']}" for e in report["errors"]]
          if report.get("warnings"):
              lines += ["", "### Warnings", ""]
              lines += [f"- {w['rule']} `{w['path']}` — {w['message']}" for w in report["warnings"][:25]]
          if not report.get("errors") and not report.get("warnings"):
              lines.append("No findings.")
          print("\n".join(lines))
          with open("guard-summary.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          for e in report.get("errors", []):
              print(f"::error title=Datapack guard::{e['rule']}: {e['path']} - {e['message']}")
          SUMMARY_EOF

          if [ -f guard-summary.md ]; then
            cat guard-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${status:-0}"

      - name: Archive verification (kill switch + registry)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_archive.py --strict
          python3 scripts/datapacks_disable.py verify

      - name: Upload guard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: datapack-guard-report
          path: |
            datapack-guard-report.json
            guard-summary.md
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 50

    permissions:
      contents: read

    env:
      FORCE_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/gui_generator/pyproject.toml
            scripts/gui_generator/requirements.txt

      # Node is still required, but only for the website behaviour test
      # (scripts/tests/site_behavior.test.mjs). The dpgen and datapack_lint
      # npm caches that used to live here were archived with the programme.
      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install Python quality tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "pytest" \
            "build" \
            "twine" \
            -e ./scripts/gui_generator

      - name: Run canonical project CI task graph
        shell: bash
        # Loom remapping is memory-intensive. Cap worker concurrency so this
        # one daemon stays within the standard hosted runner budget.
        # `ci` = verifyProject (guard, kill switch, registry, tests) +
        # packageProject (mod jars + project inventory). Packs are archived,
        # so -PconfirmZip has no effect any more and is not passed.
        run: |
          set -euo pipefail
          ./gradlew ci --console=plain --max-workers=2

      - name: Collect release assets
        shell: bash
        # Packs are retired. Release assets are Fabric mod jars only.
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          files=(mods/*/build/libs/*.jar)
          files=("${files[@]/%-sources.jar/}")
          files=("${files[@]/%-javadoc.jar/}")

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=No release assets::packageProject produced no mod jars."
            exit 1
          fi

          duplicate_names="$(printf '%s\n' "${files[@]}" | xargs -n1 basename | sort | uniq -d)"
          if [ -n "$duplicate_names" ]; then
            echo "::error title=Duplicate release asset names::${duplicate_names}"
            exit 1
          fi

          cp -v "${files[@]}" release-assets/
          ( cd release-assets && sha256sum -- *.jar > SHA256SUMS )

      - name: Write job summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Quality summary"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Gradle entry point | \`./gradlew ci\` |"
            echo "| Java | \`25\` |"
            echo "| Python | \`3.12\` |"
            echo "| Node | \`20\` |"
            echo "| Release assets (mod jars) | \`$(find release-assets -maxdepth 1 -type f -name '*.jar' | wc -l | tr -d ' ')\` |"
            echo "| Datapacks | retired (archived/archive.json) |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-outputs
          path: |
            mods/**/build/libs/*.jar
            build/reports/repository/
            build/reports/repository/project-inventory.json
            build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-packs
          path: |
            release-assets/*.zip
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  guigenmc-package:
    name: guigenmc source and wheel package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/gui_generator/pyproject.toml

      - name: Build and inspect package
        shell: bash
        working-directory: scripts/gui_generator
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"Expected one wheel, found {wheels!r}")
          if not any(name.endswith("static/index.html") for name in zipfile.ZipFile(wheels[0]).namelist()):
              sys.exit("Wheel is missing static/index.html")
          PY

      - name: Upload guigenmc distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guigenmc-distributions
          path: scripts/gui_generator/dist/*
          if-no-files-found: error
          retention-days: 7

  gate:
    name: Quality gate
    needs: [datapack-guard, verify, guigenmc-package]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.gate.outputs.verified }}

    permissions:
      contents: read

    steps:
      - name: Evaluate required jobs
        id: gate
        shell: bash
        env:
          GUARD: ${{ needs.datapack-guard.result }}
          VERIFY: ${{ needs.verify.result }}
          PACKAGE: ${{ needs.guigenmc-package.result }}
        run: |
          set -euo pipefail
          {
            echo "# Quality gate"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Datapack guard | \`$GUARD\` |"
            echo "| Verify, test and package | \`$VERIFY\` |"
            echo "| guigenmc package | \`$PACKAGE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GUARD" = success ] && [ "$VERIFY" = success ] && [ "$PACKAGE" = success ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "verified=false" >> "$GITHUB_OUTPUT"
          echo "::error title=Quality gate failed::One or more required jobs did not succeed."
          exit 1
