# .github/workflows/pages.yml
#
# Publishes the static download page (index.html) to GitHub Pages and refreshes
# its data snapshot.
#
# Why PHP runs here and not on the site: GitHub Pages serves static files only,
# so PHP can never execute when a visitor opens the page. PHP is used as a
# BUILD step instead: scripts/site/build_site_data.php asks the GitHub API for
# the packs-latest release and the mods/ directory with this workflow's
# GITHUB_TOKEN and writes data/site-data.json into the artifact. index.html
# reads that file first (same origin, no anonymous 60-requests/hour limit) and
# only falls back to the live GitHub API from the browser if the file is
# missing, malformed or older than 3 hours.
#
# One-time setup (a workflow cannot do this with GITHUB_TOKEN): repository
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions". Until
# that is set, the deploy job fails; the build job still validates the site.
#
# AI involvement: written with Claude (Anthropic) at the request of the
# maintainer. See CREDITS.md.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - banner.png
      - robots.txt
      - sitemap.xml
      - .nojekyll
      - scripts/site/**
      - .github/workflows/pages.yml
  # Refresh the snapshot after the CI workflow (which publishes packs-latest)
  # finishes on main. Events created with GITHUB_TOKEN, such as a release
  # published by CI, do not start workflows, but workflow_run does.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Safety net for anything the triggers above miss. GitHub disables scheduled
  # workflows after 60 days without repository activity; the page then keeps
  # serving its last snapshot and falls back to the live API once it is stale.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a running deployment; at most one newer run waits.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: "8.3"
          extensions: curl, json
          coverage: none

      - name: Lint PHP
        run: php -l scripts/site/build_site_data.php

      - name: Stage static files
        run: |
          mkdir -p _site/data
          cp index.html banner.png robots.txt sitemap.xml .nojekyll _site/

      - name: Build data snapshot (PHP)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: php scripts/site/build_site_data.php --out=_site/data/site-data.json

      - name: Validate site
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          site = pathlib.Path("_site")
          for name in ("index.html", "banner.png", "robots.txt", "sitemap.xml", ".nojekyll", "data/site-data.json"):
              if not (site / name).is_file():
                  sys.exit(f"missing from site: {name}")
          data = json.loads((site / "data/site-data.json").read_text(encoding="utf-8"))
          if data.get("schemaVersion") != 1 or not data.get("mods"):
              sys.exit("site-data.json failed validation")
          if "<?php" in (site / "index.html").read_text(encoding="utf-8"):
              sys.exit("index.html contains PHP, which GitHub Pages would serve as text")
          print(f"ok: {len(data['packs'])} packs, {len(data['mods'])} mods, generated {data['generatedAt']}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
