name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The reusable quality workflow checks out and runs repository code with a
# read-only token. Only the publish job receives write permission; it never
# checks out or executes repository code and consumes only the gated artifact.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A main-branch run may be waiting for release-environment approval. Never
  # cancel it with a newer push; other refs can safely keep only the latest run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish packs-latest
    needs: quality
    # Safety pause: publishing previously deleted release assets. Keep the
    # quality job active, but do not publish until an append-only release
    # design and its recovery procedure receive independent review.
    # Previous eligibility (preserved for the future redesign): verified
    # quality output, main branch, and push or workflow_dispatch events.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    # Configure required reviewers on this environment to make publishing an
    # explicit approval rather than an automatic side effect of a green build.
    environment: release

    steps:
      - name: Download gated release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packs
          path: release-assets

      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.zip)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=No release assets::The gated artifact contained no ZIP files."
            exit 1
          fi

          empty=0
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error title=Empty release asset::$file is zero bytes."
              empty=1
            fi
          done
          [ "$empty" -eq 0 ] || exit 1

          if [ ! -f release-assets/SHA256SUMS ]; then
            echo "::error title=Missing checksums::The gated artifact has no SHA256SUMS manifest."
            exit 1
          fi
          ( cd release-assets && sha256sum --check SHA256SUMS )

          {
            echo "# Release candidate"
            echo
            echo "Publishing ${#files[@]} gated ZIP artifact(s)."
            printf '%s\n' "${files[@]}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish packs-latest
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: packs-latest
          name: Latest packs
          body: |
            New uploads are built by the read-only reusable quality workflow.
            Older assets may remain and must not be assumed to match the
            current `packs/` tree. Automatic publication is paused pending a
            reviewed append-only design; the quality checks still run.
            The publish job also runs in the `release` environment; GitHub
            requests a manual approval there only when required reviewers are
            configured for that environment.
          files: release-assets/*.zip
          # This does not make the upstream action fully non-destructive.
          # The publish job remains disabled until it is safely redesigned.
          overwrite_files: false
          fail_on_unmatched_files: true
          make_latest: true

      # This diagnostic is intentionally non-destructive. The publish job is
      # paused above; keep old assets even if their source pack is no longer in
      # the current tree. Do not re-enable publication without a reviewed
      # append-only design, including upstream action failure/cleanup behavior.
      - name: Report retained older release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_assets="$(cd release-assets && printf '%s\n' *.zip | LC_ALL=C sort)"
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/packs-latest" --jq '.id'
          )"
          actual_assets="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[].name' | LC_ALL=C sort)"
          older_assets="$(comm -13 <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets"))"
          if [ -z "$older_assets" ]; then
            echo "No extra release assets were found."
            exit 0
          fi
          {
            echo "### Retained older release assets"
            echo "The following assets were preserved and may differ from the current source tree:"
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              printf -- '- `%s`\n' "$asset"
            done <<< "$older_assets"
          } >> "$GITHUB_STEP_SUMMARY"
