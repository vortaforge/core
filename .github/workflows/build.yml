name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The reusable quality workflow checks out and runs repository code with a
# read-only token. Only the publish job receives write permission; it never
# checks out or executes repository code and consumes only the gated artifact.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A main-branch run may be waiting for release-environment approval. Never
  # cancel it with a newer push; other refs can safely keep only the latest run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish packs-latest
    needs: quality
    if: >
      needs.quality.outputs.verified == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    # Configure required reviewers on this environment to make publishing an
    # explicit approval rather than an automatic side effect of a green build.
    environment: release

    steps:
      - name: Download gated release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packs
          path: release-assets

      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.zip)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=No release assets::The gated artifact contained no ZIP files."
            exit 1
          fi

          empty=0
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error title=Empty release asset::$file is zero bytes."
              empty=1
            fi
          done
          [ "$empty" -eq 0 ] || exit 1

          if [ ! -f release-assets/SHA256SUMS ]; then
            echo "::error title=Missing checksums::The gated artifact has no SHA256SUMS manifest."
            exit 1
          fi
          ( cd release-assets && sha256sum --check SHA256SUMS )

          {
            echo "# Release candidate"
            echo
            echo "Publishing ${#files[@]} gated ZIP artifact(s)."
            printf '%s\n' "${files[@]}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish packs-latest
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: packs-latest
          name: Latest packs
          body: |
            Built by the read-only reusable quality workflow from the current
            `packs/` tree: individual pack archives plus the merged datapack.
            Publication runs only after the explicit quality gate succeeds.
            The publish job also runs in the `release` environment; GitHub
            requests a manual approval there only when required reviewers are
            configured for that environment.
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          make_latest: true

      # action-gh-release updates the rolling packs-latest release in place,
      # so an asset whose pack was renamed or removed would otherwise stay
      # downloadable forever (guikit-demo.zip and RTWrapper-1.21.1.zip did).
      # Mirror the verified asset set after a successful upload. This removes
      # only release assets, never repository history or source files.
      - name: Remove stale packs-latest assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          trap 'rm -f "$expected_file" "$actual_file"' EXIT

          (
            cd release-assets
            printf '%s\n' *.zip
          ) | sort > "$expected_file"

          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/packs-latest" --jq '.id'
          )"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[].name' | sort > "$actual_file"

          stale_assets="$(comm -13 "$expected_file" "$actual_file")"
          if [ -z "$stale_assets" ]; then
            echo "No stale packs-latest assets."
            exit 0
          fi

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            echo "Removing stale release asset: $asset"
            gh release delete-asset packs-latest "$asset" \
              --repo "$GITHUB_REPOSITORY" --yes
            echo "- Removed stale asset \`$asset\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$stale_assets"
