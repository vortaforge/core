name: Power Tools (UI)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - unzip
          - split
          - merge
          - extract-specific
          - bulk-rename
          - repack
          - lfs-migrate
          - rewrite-history
          - force-push
          - run-script
          - datapack-edit
          - multi-version-test
          - upload-release
      file:
        description: "File / folder name (if needed)"
        required: false
      extra:
        description: "Extra parameter (e.g. 95M, pattern, etc.)"
        required: false
      dry_run:
        description: "Dry run only (true/false)"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # required for history rewrite
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== FILE OPERATIONS ==========
      - name: Unzip
        if: inputs.action == 'unzip'
        run: |
          mkdir -p extracted
          unzip -o "${{ inputs.file }}" -d extracted/
          ls -la extracted/

      - name: Split large file
        if: inputs.action == 'split'
        run: |
          SIZE=${{ inputs.extra || '95M' }}
          split -b $SIZE "${{ inputs.file }}" part_
          ls -lh part_*

      - name: Merge parts
        if: inputs.action == 'merge'
        run: |
          cat part_* > "${{ inputs.file }}"
          ls -lh "${{ inputs.file }}"

      - name: Extract specific files
        if: inputs.action == 'extract-specific'
        run: |
          unzip "${{ inputs.file }}" ${{ inputs.extra }}

      - name: Bulk rename
        if: inputs.action == 'bulk-rename'
        run: |
          # example: .txt → .mcfunction
          find . -name "*.txt" -exec rename 's/\.txt$/.mcfunction/' {} +

      - name: Repack (delete folders + re-zip)
        if: inputs.action == 'repack'
        run: |
          rm -rf temp
          mkdir temp
          unzip -o "${{ inputs.file }}" -d temp/
          # add any delete / edit operations here
          cd temp && zip -r ../new-pack.zip .

      # ========== GIT OPERATIONS ==========
      - name: Migrate to LFS
        if: inputs.action == 'lfs-migrate'
        run: |
          git lfs install
          git lfs track "${{ inputs.extra || '*.zip' }}"
          git add .gitattributes
          git add .
          git commit -m "Migrate to LFS" || true
          git push

      - name: History rewrite (use with caution)
        if: inputs.action == 'rewrite-history'
        run: |
          # Example: remove a large file from history
          git filter-repo --path ${{ inputs.file }} --invert-paths --force
          git push --force

      - name: Force push
        if: inputs.action == 'force-push'
        run: |
          git push --force-with-lease origin HEAD

      # ========== AUTOMATION ==========
      - name: Run arbitrary script
        if: inputs.action == 'run-script'
        run: |
          bash -c "${{ inputs.extra }}"

      - name: Datapack edit
        if: inputs.action == 'datapack-edit'
        run: |
          unzip -o "${{ inputs.file }}" -d dp/
          # examples of editing pack.mcmeta, functions, textures
          sed -i 's/"pack_format": [0-9]*/"pack_format": 48/' dp/pack.mcmeta
          # ... any other changes you want
          cd dp && zip -r ../edited-datapack.zip .

      - name: Multi-version test (matrix)
        if: inputs.action == 'multi-version-test'
        strategy:
          matrix:
            mc_version: [1.20.4, 1.21, 1.21.3]
        run: |
          echo "Testing on ${{ matrix.mc_version }}"
          # your test commands here

      - name: Upload to Release
        if: inputs.action == 'upload-release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.extra || 'latest' }} "${{ inputs.file }}" --clobber

      # Upload results as artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ inputs.action }}
          path: |
            extracted/
            part_*
            new-*.zip
            edited-*.zip
          retention-days: 5
