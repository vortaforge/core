[build-system]
# Pin upper bounds for reproducible builds; setuptools>=61 needed for pyproject.toml.
requires = ["setuptools>=61,<85", "wheel>=0.40,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "guigenmc"
version = "1.3.0"
description = "JSON → Minecraft GUI datapack generator (CLI + web UI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Unlicense" }
authors = [{ name = "VortaForge" }]
keywords = ["minecraft", "datapack", "gui", "generator", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: The Unlicense (Unlicense)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vortaforge/core/tree/main/scripts/gui_generator"
Documentation = "https://github.com/vortaforge/core/tree/main/scripts/gui_generator#readme"
Repository = "https://github.com/vortaforge/core"
Issues = "https://github.com/vortaforge/core/issues"
Changelog = "https://github.com/vortaforge/core/commits/main/scripts/gui_generator"

[project.scripts]
guigenmc = "guigenmc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guigenmc*"]

[tool.setuptools.package-data]
guigenmc = ["static/*", "static/**/*"]
