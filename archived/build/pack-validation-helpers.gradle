// -----------------------------------------------------------------------
// 5. Shared datapack-validation helpers + checkPacks / printPackList /
//    printModList
//
// The vc* helpers below are shared by checkPacks (this section) and
// mergeDatapacks (section 6) so "what counts as a valid pack / format /
// resolvable function reference" is defined exactly once:
//   - vcIsValidNamespace - [a-z0-9_.-]+ resource-location namespace rule
//   - vcNormalizeFormatValue / vcCompareFormats - int or [major, minor]
//     pack-format handling (minor versions exist for new formats, e.g.
//     "min_format": [121, 1])
//   - vcSanitizePackId - safe [a-z0-9_] id derived from a pack dir name,
//     used for storage paths, wrapper function paths and scoreboard names
//   - vcParseFunctionRef / vcResolveFunctionRef - 'ns:path' / '#ns:tag'
//     parsing plus an existence check against a pack's data/ root (both
//     the modern singular function/ layout and the legacy plural
//     functions/ layout are accepted)
//   - vcJsonEscape - minimal JSON string escaper for generated tellraws
//   - vcReadTagValues - lenient "values" reader for function-tag files
