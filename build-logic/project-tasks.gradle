// =============================================================================
// vortaforge/core - build-logic/project-tasks.gradle
//
// Project-level Gradle task graph for this monorepo. The individual Fabric
// projects keep ownership of their own toolchains and build files; this
// script owns only repository-wide checks and CI entry points.
//
// DATAPACKS ARE DISABLED. The datapack tooling that used to be wired here was
// archived on 2026-11-05 (see archived/README.md and archived/archive.json):
//
//   removed task                    now
//   ------------------------------  ------------------------------------------
//   checkProvenance                 archived/build/origin-watermark-helpers.gradle
//   installDatapackLintDependencies archived/tools/datapack-lint (npm ci)
//   testDatapackLint                archived/tools/datapack-lint (npm test)
//   lintDatapacks                   archived/tools/lint_datapacks.sh
//   testDpgen                       archived/tools/dpgen (npm test)
//   checkPacks                      archived/build/check-packs.gradle
//   checkOriginWatermarks           archived/build/origin-watermark-helpers.gradle
//   zipPacks / mergeDatapacks       archived/build/zip-packs.gradle, merge-datapacks.gradle
//
// New here: guardArchives (the datapack_guard pre-merge policy) and
// checkDatapackSwitch (the kill switch), both fail-closed.
//
// Apply this script from the root build.gradle only.
// =============================================================================

if (project != rootProject) {
    throw new GradleException('build-logic/project-tasks.gradle must be applied by the root project only.')
}

def repositoryRoot = rootProject.projectDir
def reportDirectory = layout.buildDirectory.dir('reports/repository').get().asFile
def pythonExecutable = providers.gradleProperty('pythonExecutable').getOrElse('python3')
def npmExecutable = providers.gradleProperty('npmExecutable').getOrElse('npm')

def repositorySources = files(fileTree(repositoryRoot) {
    // Generated files and local toolchains must never invalidate a source
    // check, nor accidentally become packaged/reported as project inputs.
    exclude '.git/**', '.gradle/**', '.toolchains/**', 'build/**', '**/build/**',
            'node_modules/**', '**/node_modules/**', '.idea/**', '.vscode/**'
})

def marker = { String name -> new File(reportDirectory, "${name}.ok") }
def markSuccess = { Task task, File output ->
    task.outputs.file(output)
    task.doLast {
        output.parentFile.mkdirs()
        // Deliberately deterministic: this is an up-to-date marker, not a log.
        output.setText('ok\n', 'UTF-8')
    }
}

def configureRepositoryInput = { Task task ->
    task.inputs.files(repositorySources).withPathSensitivity(PathSensitivity.RELATIVE)
}

// -----------------------------------------------------------------------------
// Verification tasks
// -----------------------------------------------------------------------------

tasks.register('testRepository', Exec) {
    group = 'verification'
    description = 'Runs repository-only Python regression tests; does not start Minecraft.'
    workingDir repositoryRoot
    commandLine pythonExecutable, '-m', 'unittest', 'discover', '-s', 'scripts/tests', '-v'
    configureRepositoryInput(delegate)
    markSuccess(delegate, marker('repository-tests'))
}

// Fail-closed policy gate: no new datapacks, no revived archived tooling, no
// blocklisted accounts. In CI the pull request diff is supplied with
// -PguardBase=<merge-base>; locally the working tree diff against HEAD is used.
// Never up-to-date: a cache hit must not be able to hide a new pack.
tasks.register('guardArchives', Exec) {
    group = 'verification'
    description = 'Blocks new datapack content, revived archived tooling and blocklisted accounts (scripts/repo/datapack_guard.py).'
    workingDir repositoryRoot
    def guardBase = providers.gradleProperty('guardBase').getOrElse('')
    def guardArgs = [pythonExecutable, 'scripts/repo/datapack_guard.py',
                     '--protect', '--blocklist', '--check-archive']
    if (guardBase) {
        guardArgs.addAll(['--base', guardBase])
    } else {
        guardArgs.add('--staged')
    }
    commandLine guardArgs
    configureRepositoryInput(delegate)
    outputs.upToDateWhen { false }
    markSuccess(delegate, marker('guard-archives'))
}

tasks.register('verifyProject') {
    group = 'verification'
    description = 'Runs repository verification: guard, kill switch, archive registry, tests. Never starts a Minecraft server.'
    dependsOn 'guardArchives', 'checkDatapackSwitch', 'checkArchive',
            'testRepository', 'verifyMod'
}

// -----------------------------------------------------------------------------
// Packaging and reporting tasks
// -----------------------------------------------------------------------------

def inventoryOutput = new File(reportDirectory, 'project-inventory.json')
def repositoryName = rootProject.name
def projectInventory = rootProject.subprojects.collect { sub ->
    [path: sub.path, directory: rootProject.relativePath(sub.projectDir)]
}.sort { left, right -> left.path <=> right.path }

tasks.register('writeProjectInventory') {
    group = 'reporting'
    description = 'Writes a deterministic JSON inventory of discovered Gradle subprojects and the archived registry.'
    inputs.files(new File(repositoryRoot, 'archived/archive.json')).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(inventoryOutput)
    doLast {
        def registry = new groovy.json.JsonSlurper().parse(new File(repositoryRoot, 'archived/archive.json'))
        def archived = (registry instanceof Map && registry.projects instanceof List) ? registry.projects.collect { p ->
            [id: p.id, kind: p.kind, status: p.status, disarmed: p.disarmed == true, path: p.path]
        } : []
        def switchFile = new File(repositoryRoot, 'datapacks.disabled.json')
        def switchData = switchFile.exists() ? new groovy.json.JsonSlurper().parse(switchFile) : [enabled: false]
        def inventory = [
            schemaVersion   : 2,
            project         : repositoryName,
            subprojects     : projectInventory,
            datapacksEnabled: switchData.enabled == true,
            archived        : archived,
        ]
        inventoryOutput.parentFile.mkdirs()
        inventoryOutput.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(inventory)) + '\n', 'UTF-8')
    }
}

tasks.register('packageProject') {
    group = 'distribution'
    description = 'Builds mod artifacts and the project inventory (datapack archives were retired; requires -PconfirmZip=yes for the legacy pack step that no longer exists).'
    dependsOn 'buildAll', 'writeProjectInventory'
}

tasks.register('ci') {
    group = 'verification'
    description = 'Canonical CI entry point: offline verification and the mod artifacts.'
    dependsOn 'verifyProject', 'packageProject'
}
