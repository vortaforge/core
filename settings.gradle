// =============================================================================
// vortaforge/core - settings.gradle
//
// Responsible for:
//   1. Plugin repositories (pluginManagement).
//   2. Auto-discovering every buildable subproject under mods/, packs/,
//      examples/ and wiring it into the multi-project build.
// =============================================================================

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'vortaforge-core'

def SCAN_ROOTS = ['mods', 'packs', 'examples']
def EXCLUDED_PROJECT_DIRS = []

def DEBUG = startParameter.projectProperties.get('debugSettings') == '1'

// --- ANSI Renk Kodları ---
def RESET   = "\u001B[0m"
def BLACK   = "\u001B[30m"
def RED     = "\u001B[31m"
def GREEN   = "\u001B[32m"
def YELLOW  = "\u001B[33m"
def BLUE    = "\u001B[34m"
def PURPLE  = "\u001B[35m"
def CYAN    = "\u001B[36m"
def WHITE   = "\u001B[37m"
def BOLD    = "\u001B[1m"

// Dinamik ve renkli loglama fonksiyonları
def debugLog  = { String msg -> if (DEBUG) println "${CYAN}[settings:debug]${RESET} ${msg}" }
def successLog= { String msg -> if (DEBUG) println "${GREEN}[settings:success]${RESET} ${BOLD}${msg}${RESET}" }
def warnLog   = { String msg -> println "${YELLOW}[settings:warn]${RESET} ${msg}" }
def skipLog   = { String msg -> if (DEBUG) println "${PURPLE}[settings:skip]${RESET} ${msg}" }

println "${BLUE}[settings]${RESET} vortaforge-core: discovering subprojects under ${SCAN_ROOTS.join(', ')}"
debugLog("Root directory (rootDir): ${rootDir}")
debugLog("Active SCAN_ROOTS: ${SCAN_ROOTS}")
debugLog("Debug mode (DEBUG) is enabled (-PdebugSettings=1)")

def includeIfGradle = { String base ->
    debugLog("--- Starting scan for root: '${base}' ---")
    File baseDir = file(base)
    if (!baseDir.exists() || !baseDir.isDirectory()) {
        warnLog("Scan root '${base}' does not exist - skipping (0 subprojects).")
        return 0
    }
    debugLog("Scan root '${base}' absolute path: ${baseDir.absolutePath}")

    int includedCount = 0
    List<File> buildFiles = []
    
    baseDir.eachFileRecurse { File f ->
        if (f.name == 'build.gradle' || f.name == 'build.gradle.kts') {
            buildFiles << f
        }
    }
    debugLog("Total candidate build files found under '${base}': ${buildFiles.size()}")

    buildFiles.sort { it.path }.each { File f ->
        File dir = f.parentFile

        if (dir.path.contains(File.separator + 'build' + File.separator) ||
            dir.path.contains(File.separator + '.gradle' + File.separator)) {
            skipLog("Ignored ${f.name} (inside build/.gradle output directory)")
            return
        }

        String relToRoot = rootDir.toPath().relativize(dir.toPath()).toString().replace(File.separator, '/')
        def exclusionReason = EXCLUDED_PROJECT_DIRS.find { excludedPath, reason ->
            relToRoot == excludedPath || relToRoot.startsWith(excludedPath + '/')
        }?.value

        if (exclusionReason != null) {
            warnLog("Excluding ${relToRoot} -> Reason: ${exclusionReason}")
            return
        }

        String rel = baseDir.toPath().relativize(dir.toPath()).toString().replace(File.separator, ':')
        def path = rel.isEmpty() ? ":${base}" : ":${base}:${rel}"

        if (findProject(path)) {
            skipLog("Skipped ${path} - already included")
            return
        }

        include(path)
        project(path).projectDir = dir
        includedCount++
        successLog("Included project: ${path} -> ${dir}")
    }

    debugLog("--- Finished scan for root: '${base}'. Total included: ${includedCount} ---")
    return includedCount
}

def discoverySummary = SCAN_ROOTS.collectEntries { root -> [(root): includeIfGradle(root)] }

println "${BLUE}[settings]${RESET} subproject discovery summary:"
discoverySummary.each { root, count ->
    println "  ${GREEN}•${RESET} ${root}/ -> ${BOLD}${count}${RESET} subproject(s)"
}
println "${BLUE}[settings]${RESET} total: ${BOLD}${discoverySummary.values().sum()}${RESET} subproject(s), " +
        "${EXCLUDED_PROJECT_DIRS.size()} excluded"
