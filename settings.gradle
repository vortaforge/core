// =============================================================================
// vortaforge/core - settings.gradle (Ultra-Detailed Debug Edition)
//
// Responsible for:
//   1. Plugin repositories (pluginManagement).
//   2. Auto-discovering every buildable subproject under mods/, packs/,
//      examples/ and wiring it into the multi-project build.
// =============================================================================
pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name = 'vortaforge-core'
// Roots to scan for subprojects. Each entry is a top-level directory relative
// to the repo root; every build file found underneath becomes a subproject.
//
// 'archived/' is deliberately NOT a scan root: everything there is disarmed
// (see archived/archive.json) and must never become a buildable subproject
// again. 'packs/' stays listed so the discovery summary reports it as empty
// rather than silently vanishing; datapacks were retired on 2026-11-05.
def SCAN_ROOTS = ['mods', 'packs', 'examples']
def EXCLUDED_PROJECT_DIRS = []
def DEBUG = startParameter.projectProperties.get('debugSettings') == '1'
// --- ANSI Color Codes ---
def RESET   = "\u001B[0m"
def RED     = "\u001B[31m"
def GREEN   = "\u001B[32m"
def YELLOW  = "\u001B[33m"
def BLUE    = "\u001B[34m"
def PURPLE  = "\u001B[35m"
def CYAN    = "\u001B[36m"
def BOLD    = "\u001B[1m"
// Dynamic Log Functions
def debugLog   = { String msg -> if (DEBUG) println "${CYAN}[settings:debug]${RESET} ${msg}" }
def traceLog   = { String msg -> if (DEBUG) println "${PURPLE}[settings:trace]${RESET}   ↳ ${msg}" }
def successLog = { String msg -> if (DEBUG) println "${GREEN}[settings:success]${RESET} ${BOLD}${msg}${RESET}" }
def warnLog    = { String msg -> println "${YELLOW}[settings:warn]${RESET}    ${msg}" }
def skipLog    = { String msg -> if (DEBUG) println "${BLUE}[settings:skip]${RESET}    ${msg}" }
debugLog("vortaforge-core: initializing multi-project setup...")
debugLog("Root directory (rootDir): ${rootDir}")
debugLog("Gradle version: ${gradle.gradleVersion}")
debugLog("Active SCAN_ROOTS: ${SCAN_ROOTS}")
debugLog("Configured EXCLUDED_PROJECT_DIRS: ${EXCLUDED_PROJECT_DIRS}")
debugLog("Debug mode status: ${DEBUG ? 'ENABLED (-PdebugSettings=1 active)' : 'DISABLED (run with -PdebugSettings=1 for full traces)'}")
// -----------------------------------------------------------------------
// Subproject Discovery and Inclusion Engine (Full Trace)
// -----------------------------------------------------------------------
def includeIfGradle = { String base ->
    debugLog("=======================================================================")
    debugLog("[SCAN-START] Analyzing root directory: '${base}'")
    debugLog("=======================================================================")
    
    File baseDir = file(base)
    debugLog("Resolved File object for base '${base}': absolutePath = ${baseDir.absolutePath}")
    if (!baseDir.exists()) {
        warnLog("Scan root '${base}' does NOT exist on disk! Skipping.")
        return 0
    }
    if (!baseDir.isDirectory()) {
        warnLog("Scan root '${base}' exists but is NOT a directory! Skipping.")
        return 0
    }
    successLog("Scan root '${base}' verified successfully. Starting recursive traversal...")
    int includedCount = 0
    List<File> buildFiles = []
    
    long traversalStart = System.currentTimeMillis()
    baseDir.eachFileRecurse { File f ->
        if (f.name == 'build.gradle' || f.name == 'build.gradle.kts') {
            traceLog("Discovered candidate file: ${f.absolutePath}")
            buildFiles << f
        }
    }
    long traversalDuration = System.currentTimeMillis() - traversalStart
    debugLog("Traversal completed in ${traversalDuration}ms. Total candidate files found: ${buildFiles.size()}")
    if (buildFiles.isEmpty()) {
        warnLog("No build files found under scan root '${base}'.")
        return 0
    }
    // Ordering (Deterministic Order)
    debugLog("Sorting build files alphabetically by path for deterministic ordering...")
    buildFiles.sort { it.path }
    buildFiles.each { File f ->
        File dir = f.parentFile
        traceLog("-------------------------------------------------------------------")
        traceLog("Evaluating directory: ${dir.absolutePath}")
        traceLog("Associated build file: ${f.name}")
        // 1. Build / .gradle directory check
        if (dir.path.contains(File.separator + 'build' + File.separator) ||
            dir.path.contains(File.separator + '.gradle' + File.separator)) {
            skipLog("IGNORED: Directory is inside an output build/ or .gradle/ folder -> ${dir.path}")
            return
        }
        traceLog("Check passed: Not inside a build output directory.")
        // 2. Relative path calculation
        String relToRoot = rootDir.toPath().relativize(dir.toPath()).toString().replace(File.separator, '/')
        traceLog("Calculated relative path to repo root: '${relToRoot}'")
        // 3. Exclusions check
        def exclusionReason = EXCLUDED_PROJECT_DIRS.find { excludedPath, reason ->
            relToRoot == excludedPath || relToRoot.startsWith(excludedPath + '/')
        }?.value
        if (exclusionReason != null) {
            warnLog("EXCLUDED: Project at '${relToRoot}' skipped. Reason: ${exclusionReason}")
            return
        }
        traceLog("Check passed: Not listed in EXCLUDED_PROJECT_DIRS.")
        // 4. Gradle Project Path calculation
        String rel = baseDir.toPath().relativize(dir.toPath()).toString().replace(File.separator, ':')
        def path = rel.isEmpty() ? ":${base}" : ":${base}:${rel}"
        traceLog("Calculated Gradle project path string: '${path}'")
        // 5. Already included check
        if (findProject(path)) {
            skipLog("SKIPPED: Project path '${path}' is already registered in the multi-project tree.")
            return
        }
        traceLog("Check passed: Project path is unique and not yet registered.")
        // 6. Include the project
        // Fail closed. Catching this and carrying on turned a broken subproject
        // into a warning nobody reads: the build then "succeeds" while quietly
        // skipping a mod, so CI can go green without compiling everything. A
        // directory that declares a build file and cannot be included is a
        // configuration error, not a note.
        try {
            traceLog("Executing include('${path}') and mapping projectDir to '${dir.absolutePath}'...")
            include(path)
            project(path).projectDir = dir
            includedCount++
            successLog("SUCCESS: Included project [${path}] mapped to directory: ${dir}")
        } catch (Exception e) {
            throw new GradleException(
                "settings.gradle: failed to include subproject '${path}' from '${dir}': ${e.message}" +
                (EXCLUDED_PROJECT_DIRS.isEmpty()
                    ? ". If this directory must not be buildable, add it to EXCLUDED_PROJECT_DIRS with a reason."
                    : ""), e)
        }
    }
    debugLog("=======================================================================")
    debugLog("[SCAN-END] Root '${base}' finished. Total subprojects successfully included: ${includedCount}")
    debugLog("=======================================================================")
    return includedCount
}
// -----------------------------------------------------------------------
// Execution and Summary Reporting
// -----------------------------------------------------------------------
debugLog("Initiating discovery across all defined SCAN_ROOTS: ${SCAN_ROOTS}")
long globalStart = System.currentTimeMillis()
def discoverySummary = SCAN_ROOTS.collectEntries { root -> 
    [(root): includeIfGradle(root)] 
}
long globalDuration = System.currentTimeMillis() - globalStart
// One line by default, the full banner under -PdebugSettings=1.
//
// This block used to print nine lines on every single invocation - `gradle
// tasks`, an IDE sync, a one-line `:mods:afk-manager:build` - because println
// is not gated by a log level the way Gradle's own output is. The information
// is worth keeping (it is the only place that says how many subprojects were
// wired), so it moved behind the DEBUG switch that already governs the rest of
// this file rather than being deleted.
int wiredTotal = discoverySummary.values().sum()
if (DEBUG) {
    println "${BLUE}[settings]${RESET} ==========================================================="
    println "${BLUE}[settings]${RESET} Subproject Discovery Summary (Completed in ${globalDuration}ms):"
    println "${BLUE}[settings]${RESET} ==========================================================="
    discoverySummary.each { root, count ->
        println "  ${GREEN}•${RESET} Root ${BOLD}${root}/${RESET} -> ${BOLD}${count}${RESET} subproject(s) discovered"
    }
    println "${BLUE}[settings]${RESET} -----------------------------------------------------------"
    println "${BLUE}[settings]${RESET} Total Subprojects Wired: ${BOLD}${wiredTotal}${RESET}"
    println "${BLUE}[settings]${RESET} Total Explicitly Excluded: ${BOLD}${EXCLUDED_PROJECT_DIRS.size()}${RESET}"
    println "${BLUE}[settings]${RESET} ==========================================================="
} else {
    println "${BLUE}[settings]${RESET} ${wiredTotal} subproject(s) wired (${globalDuration}ms). Run with -PdebugSettings=1 for the per-root breakdown."
}
debugLog("Settings file evaluation finished successfully with zero fatal errors.")
